name: Continuous Integration

on:
  push:
    tags:
      - v*
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  linters:
    name: Run linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: |
            go.sum
            test/go.sum
      - name: Lint .
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: Lint other modules
        run: go list -m -f '{{.Dir}}/...' | golangci-lint run

  unit-tests:
    name: Run unit tests (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Minimum supported version: test only the main module, as auxiliary modules may require a newer Go.
          # GOTOOLCHAIN=local makes the job fail instead of silently switching to a newer toolchain.
          # The exact .0 release also catches dependency updates that raise the go directive to a newer patch.
          - go: '1.22.0'
            gowork: 'off'
            gotoolchain: local
          - go: '1.27'
    env:
      GOWORK: ${{ matrix.gowork }}
      GOTOOLCHAIN: ${{ matrix.gotoolchain }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Test
        run: go list -m -f '{{.Dir}}/...' | xargs go test -race -coverprofile=cover.out -coverpkg=./...

      - name: Collect coverage
        run: go tool cover -html=cover.out -o cover.html

      - name: Upload coverage to codecov.io
        uses: codecov/codecov-action@v4
        env: 
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
